name: Bootstrap Property Hub source baseline

on:
  push:
    branches:
      - bootstrap/v0.14.65
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.part* | base64 --decode > /tmp/propertyhub-source.tar.xz
          echo "cc50837904cfafe7fab925824ddd8034969ba24648bede76688d46f25d6319f4  /tmp/propertyhub-source.tar.xz" | sha256sum -c -
          mkdir -p /tmp/propertyhub-source
          tar -xJf /tmp/propertyhub-source.tar.xz -C /tmp/propertyhub-source
      - name: Materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap ! -name .github -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' --exclude='.bootstrap/' /tmp/propertyhub-source/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml
      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Property Hub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Property Hub v0.14.65 source baseline"
          git push origin HEAD:bootstrap/v0.14.65
