name: Bootstrap Property Hub source baseline

on:
  push:
    branches:
      - bootstrap/v0.14.65
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-aa2c-822f-b633-ef9296268983/raw?se=2026-10-24T20%3A19%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=beeddd31-adb4-532c-8b5c-42e6c5437d09&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-24T00%3A44%3A21Z&ske=2026-10-25T00%3A44%3A21Z&sks=b&skv=2026-02-06&sig=kg36l3OFPE/VEhK35KytVNpYTy0meM04UFbxM7wm5Os%3D"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify official v0.14.65 package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/propertyhub-v0.14.65.zip
          echo "d0cd477e512cb6f2c37bbd125776a18133035917c1f20550982ff24257049ba7  /tmp/propertyhub-v0.14.65.zip" | sha256sum -c -
          mkdir -p /tmp/propertyhub-v0.14.65
          unzip -q /tmp/propertyhub-v0.14.65.zip -d /tmp/propertyhub-v0.14.65
      - name: Materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap ! -name .github -exec rm -rf {} +
          rsync -a             --exclude='storage/'             --exclude='.env'             --exclude='RELEASE_VALIDATION_REPORT.txt'             --exclude='resources/releases/*.zip'             /tmp/propertyhub-v0.14.65/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml
      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Property Hub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Property Hub v0.14.65 source baseline"
          git push origin HEAD:bootstrap/v0.14.65
